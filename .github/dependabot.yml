version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@inertiajs/react"
          - "@inertiajs/core"
      hono:
        patterns:
          - "hono"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      dev:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "typescript"
          - "bun"
          - "esbuild"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
